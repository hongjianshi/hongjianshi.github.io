    <!-- Social icons, shown right above the footer on every page (a page can opt out with "social: false") -->
    {%- unless page.social == false %}
    <div class="social social-footer">
      <div class="container">
        <div class="contact-icons">
        {% include social.html %}
        </div>
        <div class="contact-note">
          {{ site.contact_note }}
        </div>
      </div>
    </div>
    {%- endunless %}
